<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 273" width="932" height="273" role="img" aria-labelledby="t d"><title id="t">批量抓取、按笔记 ID 去重、导出数据</title><desc id="d">三个关键词各返回四条合成记录，N01 被三组词命中，只建一条笔记记录。可以取用 12 条逐词 JSONL 明细或 6 行去重 CSV 样本。</desc><rect x="0" y="0" width="932" height="273" rx="0" fill="#f5f7fa" stroke="none" stroke-width="1"/><path d="M308 111 V47 Q308 34 321 34 H664 Q680 34 680 50 V64 Q680 77 694 77 H719" fill="none" stroke="#82909c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M713 73 L720 77 L713 81" fill="none" stroke="#82909c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="52" width="219" height="33" rx="5" fill="#fff" stroke="#c6cfd5" stroke-width="1"/><text x="39" y="73" fill="#202b33" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" text-anchor="start">关键词 A</text><rect x="114" y="57" width="43" height="23" rx="3" fill="#e8edfc" stroke="none" stroke-width="1"/><text x="135" y="73" fill="#2549ad" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">N01</text><text x="168" y="73" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="500" text-anchor="start">N02</text><text x="209" y="73" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="500" text-anchor="start">···</text><path d="M245 68 H264 C283 68 286 112 308 112" fill="none" stroke="#2549ad" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><rect x="26" y="96" width="219" height="33" rx="5" fill="#fff" stroke="#c6cfd5" stroke-width="1"/><text x="39" y="117" fill="#202b33" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" text-anchor="start">关键词 B</text><rect x="114" y="101" width="43" height="23" rx="3" fill="#e8edfc" stroke="none" stroke-width="1"/><text x="135" y="117" fill="#2549ad" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">N01</text><text x="168" y="117" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="500" text-anchor="start">N02</text><text x="209" y="117" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="500" text-anchor="start">···</text><path d="M245 112 H264 C283 112 286 112 308 112" fill="none" stroke="#2549ad" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><rect x="26" y="140" width="219" height="33" rx="5" fill="#fff" stroke="#c6cfd5" stroke-width="1"/><text x="39" y="161" fill="#202b33" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="600" text-anchor="start">关键词 C</text><rect x="114" y="145" width="43" height="23" rx="3" fill="#e8edfc" stroke="none" stroke-width="1"/><text x="135" y="161" fill="#2549ad" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">N01</text><text x="168" y="161" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="500" text-anchor="start">N03</text><text x="209" y="161" fill="#4e5f6b" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="500" text-anchor="start">···</text><path d="M245 156 H264 C283 156 286 112 308 112" fill="none" stroke="#2549ad" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><circle cx="308" cy="112" r="3.5" fill="#2549ad"/><path d="M308 112 H373" fill="none" stroke="#2549ad" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M367 108 L374 112 L367 116" fill="none" stroke="#2549ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="394" y="59" width="153" height="105" rx="5" fill="#f4f6fd" stroke="#acbad4" stroke-width="1"/><rect x="388" y="66" width="153" height="105" rx="5" fill="#f9faff" stroke="#8d9ec4" stroke-width="1"/><rect x="382" y="73" width="153" height="101" rx="5" fill="#fff" stroke="#2